       <!--<div style="text-align: center;"><h1>Promotion Details</h1></div>-->

       <!--Now we just need to display the promotion name and its information-->

       <body>
        
        <div style="text-align: center; margin-bottom: 16px;"></div>
        <div style="text-align: center;">
            <!--<h2>Promotion Id: {{ promotion_id }}</h2>-->
            <div class="welcome-banner"style="display: inline-block; width: fit-content">
            <h2>{{ promotionName }}</h2>
            </div></div>
            <div style="text-align: center; margin-bottom: 16px;"></div>

            <div style="text-align: center;">
            <div class="card song-card"
           style="display: inline-block; width: fit-content; margin-bottom: 0;">
            <p>Promotion Description: {{ promotionDescription }}</p>
            <p>Promotion Song: {{ promotionSong }}</p>
            <p>Like Amount: {{likeAmount}}</p>
            </div></div>
            <div style="text-align: center; margin-bottom: 16px;"></div>

            <!--creating a button to like the promotion-->
            <div style="text-align: center; margin: 20px;">
                <form action="/likePromotion" method="POST">
                    <input type="hidden" name="promotionId" value="{{ promotion_id }}">
                    <button type="submit"
                        style="background-color: #e74c3c;
                        color: white;
                        border: none;
                        border-radius: 25px;
                        padding: 12px 28px;
                        font-size: 16px;
                        font-weight: bold;
                        cursor: pointer;
                        box-shadow: 0 4px 8px rgba(0,0,0,0.15);">
                        {{ hasLiked }}
                    </button>
                </form>
            </div>
        
       </body>
