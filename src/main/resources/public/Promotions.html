<main>

  <html>

  <head>
    <h2>Available Promotions</h2>
  </head>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" class="nav-link">Home</a>
            <a href="/promotions" class="nav-link">Promotion</a>
            <a href="/music-library" class="nav-link">Music Library</a>
            
            {% if isArtist %}
                <a href="/managepublications" class="nav-link">Manage Publications</a>
            {% endif %}

            <a href="/search" class="nav-link">Search</a>
            
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>



    <!--Now this is a loop where we will display each promotion by name-->
{% for promotion in promotions %}
  <div>
    <h2>
      <a href="/specific-promotion/{{ promotion.getPromotionIdByName(promotion.promotionName) }}">
        {{ promotion.promotionName }}
      </a>
    </h2>
  </div>
{% else %}
  <p>No promotions found.</p>
{% endfor %}
