<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotanote - Music Library</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" class="nav-link">Home</a>
            <a href="/promotions" class="nav-link">Promotion</a>
            <a href="/music-library" class="nav-link">Music Library</a>
            
            {% if isArtist %}
                <a href="/managepublications" class="nav-link">Manage Publications</a>
            {% endif %}

            <a href="/search" class="nav-link">Search</a>
            
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="library-container">

            <!-- Liked Songs Playlist Group -->
            <div class="playlist-group" id="liked-playlist-group">
                <div class="playlist-card" id="liked-playlist-header" onclick="togglePlaylist('liked-songs-wrapper', this)">
                    <span class="playlist-title">
                        <span class="playlist-arrow">▼</span>
                        Liked Songs
                        <span class="playlist-arrow">▼</span>
                    </span>
                </div>

                <div class="playlist-songs-wrapper" id="liked-songs-wrapper">
                    <!-- JS populates songs -->
                </div>
            </div>

            <!-- Dynamic User Created Playlists -->
            <div id="user-playlists-container" class="library-container">
                <!-- Additional user created playlists render here -->
            </div>

        </div>
    </div>

    <script>
        let likedSongs = [];
        let userPlaylists = [];

        document.addEventListener("DOMContentLoaded", () => {
            fetchLikedSongs().then(() => {
                fetchUserPlaylists();
            });
        });

        // 1. Fetch Liked Songs
        async function fetchLikedSongs() {
            try {
                const response = await fetch('/api/liked-songs');
                if (response.ok) {
                    likedSongs = await response.json();
                } else {
                    likedSongs = [];
                }
            } catch (err) {
                console.error("Error fetching liked songs:", err);
                likedSongs = [];
            }
            renderLikedSongs();
        }

        // 2. Fetch User Playlists
        async function fetchUserPlaylists() {
            try {
                const response = await fetch('/api/user-playlists');
                if (response.ok) {
                    userPlaylists = await response.json();
                } else {
                    userPlaylists = [];
                }
            } catch (err) {
                console.error("Error fetching user playlists:", err);
                userPlaylists = [];
            }
            renderUserPlaylists();
        }

        // 3. Initial Render of Liked Songs
        function renderLikedSongs() {
            const wrapper = document.getElementById('liked-songs-wrapper');
            wrapper.innerHTML = '';

            if (!likedSongs || likedSongs.length === 0) {
                wrapper.innerHTML = '<div class="empty-playlist-msg">No liked songs yet. Click the heart icon on any song to add it!</div>';
                return;
            }

            likedSongs.forEach(song => {
                const songPill = createSongPill(song, true);
                songPill.id = `liked-pill-${song.songId}`;
                wrapper.appendChild(songPill);
            });
        }

        // 4. Initial Render of User Playlists
        function renderUserPlaylists() {
            const container = document.getElementById('user-playlists-container');
            container.innerHTML = '';

            if (!userPlaylists || userPlaylists.length === 0) {
                return;
            }

            userPlaylists.forEach(playlist => {
                const wrapperId = `playlist-wrapper-${playlist.playlistId}`;
                const groupId = `playlist-group-${playlist.playlistId}`;

                const groupDiv = document.createElement('div');
                groupDiv.className = 'playlist-group';
                groupDiv.id = groupId;

                const cardHeader = document.createElement('div');
                cardHeader.className = 'playlist-card';
                cardHeader.onclick = function () { togglePlaylist(wrapperId, this); };
                cardHeader.innerHTML = `
                    <span class="playlist-title">
                        <span class="playlist-arrow">▼</span>
                        ${escapeHtml(playlist.playlistName)}
                        <span class="playlist-arrow">▼</span>
                    </span>
                `;

                const wrapper = document.createElement('div');
                wrapper.className = 'playlist-songs-wrapper';
                wrapper.id = wrapperId;

                if (!playlist.songs || playlist.songs.length === 0) {
                    wrapper.innerHTML = '<div class="empty-playlist-msg">This playlist has no songs yet.</div>';
                } else {
                    playlist.songs.forEach(song => {
                        const isLiked = likedSongs.some(ls => ls.songId === song.songId);
                        const songPill = createSongPill(song, isLiked);
                        wrapper.appendChild(songPill);
                    });
                }

                groupDiv.appendChild(cardHeader);
                groupDiv.appendChild(wrapper);
                container.appendChild(groupDiv);
            });
        }

        // 5. Create Song Pill
        function createSongPill(song, isLiked) {
            const pill = document.createElement('div');
            pill.className = 'song-pill';

            pill.innerHTML = `
                <button class="icon-btn heart-btn ${isLiked ? '' : 'unliked'}" 
                        data-song-id="${song.songId}"
                        data-tooltip="${isLiked ? 'Dislike' : 'Like'}" 
                        onclick="toggleLikeSong(${song.songId}, '${escapeJsString(song.songName)}', ${isLiked})">
                    ${isLiked ? '❤️' : '♡'}
                </button>
                <span class="song-name">${escapeHtml(song.songName)}</span>
                <div class="song-actions">
                    <button class="icon-btn" data-tooltip="Add to Playlist" onclick="toggleAddToPlaylistPopover(${song.songId}, event)">
                        ⊕
                    </button>
                    <button class="icon-btn" data-tooltip="Add to Queue" onclick="addToQueue(${song.songId}, '${escapeJsString(song.songName)}')">
                        ♫
                    </button>
                    <button class="icon-btn" data-tooltip="Play Song" onclick="selectSong(${song.songId})">
                        ▶
                    </button>
                </div>
            `;
            return pill;
        }

        // 6. Single-Open Accordion Toggle
        function togglePlaylist(wrapperId, headerElement) {
            const targetWrapper = document.getElementById(wrapperId);
            const targetGroup = headerElement.closest('.playlist-group');
            const isTargetOpen = targetWrapper.classList.contains('open');

            // Close any currently open playlist accordion
            document.querySelectorAll('.playlist-songs-wrapper.open').forEach(openWrapper => {
                if (openWrapper.id !== wrapperId) {
                    closeWrapper(openWrapper);
                }
            });

            // Toggle target playlist
            if (isTargetOpen) {
                closeWrapper(targetWrapper);
            } else {
                openWrapper(targetWrapper, headerElement, targetGroup);
            }
        }

        function closeWrapper(wrapper) {
            const header = wrapper.previousElementSibling || document.getElementById('liked-playlist-header');
            const group = wrapper.closest('.playlist-group');

            wrapper.style.maxHeight = wrapper.scrollHeight + 'px';
            wrapper.offsetHeight; // Force reflow
            wrapper.style.maxHeight = '0px';
            wrapper.classList.remove('open');
            if (header) header.classList.remove('open');
            if (group) group.classList.remove('open');
        }

        function openWrapper(wrapper, header, group) {
            if (group) group.classList.add('open');
            if (header) header.classList.add('open');
            wrapper.classList.add('open');
            wrapper.style.maxHeight = wrapper.scrollHeight + 'px';
        }

        // 7. In-Place Like / Dislike Toggle (Zero Scroll Jumps or Page Reloads)
        async function toggleLikeSong(songId, songName, currentlyLiked) {
            try {
                const endpoint = currentlyLiked 
                    ? `/api/dislike/song?songId=${songId}` 
                    : `/api/like/song?songId=${songId}`;

                const response = await fetch(endpoint, { method: 'POST' });

                if (response.ok) {
                    const isNowLiked = !currentlyLiked;

                    // Update state array
                    if (currentlyLiked) {
                        likedSongs = likedSongs.filter(s => s.songId !== songId);
                    } else {
                        likedSongs.push({ songId: songId, songName: songName });
                    }

                    // 1. Update ALL heart buttons in place across all playlists
                    document.querySelectorAll(`.heart-btn[data-song-id="${songId}"]`).forEach(btn => {
                        btn.innerHTML = isNowLiked ? '❤️' : '♡';
                        btn.setAttribute('data-tooltip', isNowLiked ? 'Dislike' : 'Like');
                        btn.onclick = () => toggleLikeSong(songId, songName, isNowLiked);
                        if (isNowLiked) {
                            btn.classList.remove('unliked');
                        } else {
                            btn.classList.add('unliked');
                        }
                    });

                    // 2. Update Liked Songs list dynamically without wiping DOM
                    updateLikedSongsContainer(songId, songName, isNowLiked);

                } else {
                    alert("Could not update song status. Please try again.");
                }
            } catch (err) {
                console.error("Error toggling like status:", err);
            }
        }

        // Helper to update the Liked Songs playlist container dynamically
        function updateLikedSongsContainer(songId, songName, isNowLiked) {
            const likedWrapper = document.getElementById('liked-songs-wrapper');
            
            if (isNowLiked) {
                const emptyMsg = likedWrapper.querySelector('.empty-playlist-msg');
                if (emptyMsg) emptyMsg.remove();

                if (!likedWrapper.querySelector(`#liked-pill-${songId}`)) {
                    const newPill = createSongPill({ songId: songId, songName: songName }, true);
                    newPill.id = `liked-pill-${songId}`;
                    likedWrapper.appendChild(newPill);
                }
            } else {
                const existingPill = likedWrapper.querySelector(`#liked-pill-${songId}`);
                if (existingPill) {
                    existingPill.remove();
                }

                if (likedWrapper.children.length === 0) {
                    likedWrapper.innerHTML = '<div class="empty-playlist-msg">No liked songs yet. Click the heart icon on any song to add it!</div>';
                }
            }

            // Adjust height if Liked Songs playlist is currently open
            if (likedWrapper.classList.contains('open')) {
                likedWrapper.style.maxHeight = likedWrapper.scrollHeight + 'px';
            }
        }

        // Utility Handlers
        function selectSong(songId) {
            // Flag autoplay in session storage prior to navigating/submitting. This will trigger music to autoplay on return to /home.
            sessionStorage.setItem('shouldAutoplay', 'true');

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/select-song';
            
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'songId';
            input.value = songId;
            
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }

        async function addToQueue(songId, songName) {
            try {
                const response = await fetch(`/api/queue/add?songId=${songId}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // Set autoplay flag so returning to /home automatically starts playback
                    sessionStorage.setItem('shouldAutoplay', 'true');
                    showToast(`Added "${songName}" to queue`);
                } else {
                    showToast(`Failed to queue "${songName}"`);
                }
            } catch (err) {
                console.error("Error adding song to queue:", err);
                showToast("Error connecting to server");
            }
        }

        function showToast(message) {
            let toast = document.getElementById('toast-notification');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast-notification';
                toast.className = 'toast-notification';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');

            // Auto-hide after 2.5 seconds
            clearTimeout(toast.timeoutId);
            toast.timeoutId = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        let activePopover = null;

        function toggleAddToPlaylistPopover(songId, event) {
            event.stopPropagation();
            
            // Toggle off if clicking the same song's button again
            if (activePopover && activePopover.id === `popover-${songId}`) {
                closePlaylistPopover();
                return;
            }

            closePlaylistPopover();

            const songPill = event.target.closest('.song-pill');
            if (!songPill) return;

            const popover = document.createElement('div');
            popover.className = 'playlist-popover';
            popover.id = `popover-${songId}`;

            let playlistListHtml = '';
            if (userPlaylists && userPlaylists.length > 0) {
                playlistListHtml = userPlaylists.map(pl => `
                    <button class="popover-playlist-item" onclick="addSongToExistingPlaylist(${songId}, ${pl.playlistId})">
                        ${escapeHtml(pl.playlistName)}
                    </button>
                `).join('');
            } else {
                playlistListHtml = '<div class="popover-empty-msg">No existing playlists</div>';
            }

            popover.innerHTML = `
                <div class="popover-create-row">
                    <span class="popover-label">New</span>
                    <input type="text" id="popover-input-${songId}" class="popover-input" placeholder="Enter Name">
                    <button class="popover-btn-add" title="Create Playlist" onclick="createNewPlaylistWithSong(${songId})">+</button>
                </div>
                <div class="popover-playlist-list">
                    ${playlistListHtml}
                </div>
            `;

            songPill.appendChild(popover);
            activePopover = popover;

            const inputField = popover.querySelector(`#popover-input-${songId}`);
            if (inputField) {
                inputField.focus();
                inputField.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        createNewPlaylistWithSong(songId);
                    }
                });
            }

            setTimeout(() => {
                document.addEventListener('click', closePopoverOnOutsideClick);
            }, 10);
        }

        // 1. Handler to add a song to an existing playlist
        async function addSongToExistingPlaylist(songId, playlistId) {
            try {
                const response = await fetch(`/api/add/song/personal/playlist?songId=${songId}&playlistId=${playlistId}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    closePlaylistPopover();
                    showToast("Added to playlist!");
                    await fetchUserPlaylists(); // Instantly refresh the playlist view
                } else {
                    showToast("Failed to add song to playlist");
                }
            } catch (err) {
                console.error("Error adding to playlist:", err);
                showToast("Error connecting to server");
            }
        }

        // 2. Handler to create a new playlist with the initial song
        async function createNewPlaylistWithSong(songId) {
            const input = document.getElementById(`popover-input-${songId}`);
            if (!input || !input.value.trim()) {
                showToast("Please enter a playlist name");
                return;
            }

            const playlistName = input.value.trim();

            try {
                const params = new URLSearchParams();
                params.append('playlistName', playlistName);
                params.append('songId', songId);

                const response = await fetch('/api/create/personal/playlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                if (response.ok) {
                    closePlaylistPopover();
                    showToast(`Created "${playlistName}"`);
                    await fetchUserPlaylists(); // Instantly render the new playlist
                } else {
                    showToast("Failed to create playlist");
                }
            } catch (err) {
                console.error("Error creating playlist:", err);
                showToast("Error connecting to server");
            }
        }

        function closePlaylistPopover() {
            if (activePopover) {
                activePopover.remove();
                activePopover = null;
            }
            document.removeEventListener('click', closePopoverOnOutsideClick);
        }

        function closePopoverOnOutsideClick(e) {
            if (activePopover && !activePopover.contains(e.target)) {
                closePlaylistPopover();
            }
        }

        function addToPlaylist(songId) {
            console.log(`Open playlist modal for song ${songId}`);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function escapeJsString(str) {
            return str.replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
