<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotanote - Music Library</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- Original Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Home</a>
            <a href="/promotions" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Promotion</a>
            <a href="/music" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Music Library</a>
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Music Library Layout -->
    <div class="main-wrapper">
        <div class="library-container">

            <!-- Liked Songs Playlist Pill Header -->
            <div class="playlist-card" id="liked-playlist-header" onclick="togglePlaylist('liked-songs-wrapper', this)">
                <span class="playlist-title">
                    <span class="playlist-arrow">▼</span>
                    Liked Songs
                    <span class="playlist-arrow">▼</span>
                </span>
            </div>

            <!-- Dynamic Liked Songs Dropdown Wrapper -->
            <div class="playlist-songs-wrapper" id="liked-songs-wrapper">
                <!-- JS populates liked songs dynamically -->
            </div>

            <!-- Placeholder for User Created Playlists -->
            <div id="user-playlists-container" class="library-container">
                <!-- Additional user created playlists will render here -->
            </div>

        </div>
    </div>

    <!-- Frontend Dynamic Script -->
    <script>
        // State store for currently liked songs
        let likedSongs = [];

        // Fetch user's liked songs from the REST API on page load
        document.addEventListener("DOMContentLoaded", () => {
            fetchLikedSongs();
        });

        // 1. Fetch liked songs from backend
        async function fetchLikedSongs() {
            try {
                const response = await fetch('/api/liked-songs');
                if (response.ok) {
                    likedSongs = await response.json();
                } else {
                    likedSongs = [];
                }
            } catch (err) {
                console.error("Error fetching liked songs:", err);
                likedSongs = [];
            }
            renderLikedSongs();
        }

        // 2. Render Liked Songs inside the dropdown container
        function renderLikedSongs() {
            const wrapper = document.getElementById('liked-songs-wrapper');
            wrapper.innerHTML = '';

            if (!likedSongs || likedSongs.length === 0) {
                wrapper.innerHTML = '<div class="empty-playlist-msg">No liked songs yet. Click the heart icon on any song to add it!</div>';
                return;
            }

            likedSongs.forEach(song => {
                const songPill = createSongPill(song, true);
                wrapper.appendChild(songPill);
            });
        }

        // 3. Helper to build a song pill element with icon buttons & tooltips
        function createSongPill(song, isLiked) {
            const pill = document.createElement('div');
            pill.className = 'song-pill';
            pill.id = `song-pill-${song.songId}`;

            pill.innerHTML = `
                <button class="icon-btn heart-btn ${isLiked ? '' : 'unliked'}" 
                        data-tooltip="${isLiked ? 'Dislike' : 'Like'}" 
                        onclick="toggleLikeSong(${song.songId}, '${escapeJsString(song.songName)}', ${isLiked})">
                    ${isLiked ? '❤️' : '♡'}
                </button>
                <span class="song-name">${escapeHtml(song.songName)}</span>
                <div class="song-actions">
                    <button class="icon-btn" data-tooltip="Add to Playlist" onclick="addToPlaylist(${song.songId})">
                        ⊕
                    </button>
                    <button class="icon-btn" data-tooltip="Add to Queue" onclick="addToQueue(${song.songId})">
                        ♫
                    </button>
                    <button class="icon-btn" data-tooltip="Play Song" onclick="selectSong(${song.songId})">
                        ▶
                    </button>
                </div>
            `;
            return pill;
        }

        // 4. Toggle Playlist Accordion Open/Closed
        function togglePlaylist(wrapperId, headerElement) {
            const wrapper = document.getElementById(wrapperId);
            wrapper.classList.toggle('open');
            headerElement.classList.toggle('open');
        }

        // 5. Handle Like / Dislike Toggle API Call
        async function toggleLikeSong(songId, songName, currentlyLiked) {
            try {
                const endpoint = currentlyLiked 
                    ? `/api/dislike/song?songId=${songId}` 
                    : `/api/like/song?songId=${songId}`;

                const response = await fetch(endpoint, { method: 'POST' });

                if (response.ok) {
                    if (currentlyLiked) {
                        // Remove song from local array
                        likedSongs = likedSongs.filter(s => s.songId !== songId);
                    } else {
                        // Add song to local array
                        likedSongs.push({ songId: songId, songName: songName });
                    }
                    renderLikedSongs();
                } else {
                    alert("Could not update song status. Please try again.");
                }
            } catch (err) {
                console.error("Error toggling like status:", err);
            }
        }

        // 6. Action Handlers
        function selectSong(songId) {
            // Post selection to current select-song route
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/select-song';
            
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'songId';
            input.value = songId;
            
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }

        function addToQueue(songId) {
            console.log(`Add song ${songId} to queue`);
            // Place backend call for queue insertion here when ready
        }

        function addToPlaylist(songId) {
            console.log(`Open playlist modal for song ${songId}`);
            // Place playlist creation/assignment flow here when ready
        }

        // Utility sanitation helpers
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function escapeJsString(str) {
            return str.replace(/'/g, "\\'");
        }
    </script>
</body>
</html>
