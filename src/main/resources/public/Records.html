<main>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotanote - Home</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <style>
.promotion-link {
    display: inline-block;
    text-decoration: none;
    transition: transform 0.2s ease;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    text-align: center;
    color: #e0e7ff;
    background: #ffffff;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 450px;
}

.promotion-link:hover {
    transform: scale(1.05);
}
</style>


  <html>
    
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" class="nav-link">Home</a>
            <a href="/records" class="nav-link">Records</a>
            <a href="/promotions" class="nav-link">Promotion</a>
            <a href="/music-library" class="nav-link">Music Library</a>
            {% if isArtist %}
                <a href="/managepublications" class="nav-link">Manage Publications</a>
            {% endif %}
            <a href="/search" class="nav-link">Search</a>
            <a href="/profile" class="nav-link">Profile</a>
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <div style="margin-bottom: 16px;"></div>
      <head>
      <div style="text-align: center;">
    <div class="welcome-banner" style="display: inline-block; width: fit-content;">
    <h2>Current Records</h2>
    </div></div>
  </head>
  <div style="margin-bottom: 16px;"></div>


{% for record in records %}
  <div style="text-align: center; margin-bottom: 16px;">
    <a
      href="/specific-record/{{ record.getRecordId(record.recordName) }}"
      style="color: #2d1466; text-decoration: none;"
    >
      <div class="promotion-link"
           style="display: inline-block; width: fit-content; margin-bottom: 0;">
        <h2 style="color: #2d1466; margin: 0;">
          {{ record.recordName }}
        </h2>
      </div>
    </a>
  </div>
{% else %}
  <p>No records found.</p>
{% endfor %}
