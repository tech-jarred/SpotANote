<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotanote - Home</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Home</a>
            <a href="/music" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Music Library</a>
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div class="home-container">
            
            <!-- Centered Audio Control Card -->
            <div class="card player-card">
                <h2 class="player-title">{{ songName }}</h2>
                <audio id="myAudio" src="{{ current_song_file_path }}" controls controlsList="nodownload" preload="metadata" class="audio-player">
                </audio>
            </div>

            <!-- Small Welcome Message at Bottom -->
            <div class="welcome-banner">
                <p class="welcome-text">Welcome, <strong>{{ username }}</strong>!</p>
                <p class="welcome-subtext">You have successfully signed into Spotanote.</p>
            </div>

        </div>
    </div>

    <!-- JavaScript Sync -->
    <script>
        const audio = document.getElementById('myAudio');

        // Resumes the song at the last timestamp it was playing at
        audio.addEventListener('loadedmetadata', () => {
            const savedTime = parseFloat("{{ timeStamp | default(0) }}");
            if (!isNaN(savedTime) && savedTime > 0 && savedTime < audio.duration) {
                audio.currentTime = savedTime;
            }
        });

        // Handles sending request to server to update latest timestamp
        function syncTimestamp() {
            if (!audio || isNaN(audio.currentTime)) return;

            const params = new URLSearchParams();
            params.append('seconds', audio.currentTime.toString());

            fetch('/api/song/timeStamp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params,
                keepalive: true
            }).catch(err => console.error('Failed to sync timestamp:', err));
        }

        // Fire sync on pause or page navigation
        audio.addEventListener('pause', syncTimestamp);
        window.addEventListener('pagehide', syncTimestamp);
    </script>
</body>
</html>
