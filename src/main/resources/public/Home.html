<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotanote - Home</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Spotanote</div>
        <div class="nav-user-controls">
            <a href="/home" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Home</a>
            <a href="/music" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 0.9rem;">Music Library</a>
            <form action="/logout" method="POST">
                <button type="submit" class="btn-logout">Logout</button>
            </form>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <div class="card">
            <h2 class="page-title">Welcome, {{ username }}!</h2>
            <p class="subtitle">You have successfully signed into the system.</p>
        </div>
    </div>

    <!-- Adding button for audio control. -->
    <audio id="myAudio" controls controlsList="nodownload" preload="metadata">
      <source src="{{ current_song_file_path }}" type="audio/mpeg">
    </audio>

    <!-- This javscript will allow user to skim through song AND checks for timeStamp attribute (sets song to where it last was) -->
    <script>
        const audio = document.getElementById('myAudio');

        // Resumes the song at the last time stamp it was playing at.
        audio.addEventListener('loadedmetadata', () => {
            const savedTime = parseFloat("{{ timeStamp | default(0) }}");
            if (!isNaN(savedTime) && savedTime > 0 && savedTime < audio.duration) {
                audio.currentTime = savedTime;
            }
        });

        // Handles sending request to server to updated the latest time stamp of song whenever page changes or music is paused.
        function syncTimestamp() {
            if (!audio || isNaN(audio.currentTime)) return;

            const params = new URLSearchParams();
            params.append('seconds', audio.currentTime.toString());

            // Send a background fetch request to route /api/song/timeStamp to sync timeStamp with backend.
            fetch('/api/song/timeStamp', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params,
                keepalive: true // will keep fetch request alive even if the page is closed or DOM is destroyed.
            }).catch(err => console.error('Failed to sync timestamp:', err));
        }

        // Fire sync on pause or page navigation
        audio.addEventListener('pause', syncTimestamp);
        window.addEventListener('pagehide', syncTimestamp);
    </script>
</body>
</html>
